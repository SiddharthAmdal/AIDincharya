name: CI & RAG Evaluation Suite

on:
  push:
    branches: [ main, Siddharth ]
  pull_request:
    branches: [ main, Siddharth ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Core Test Suite (Offline & Deterministic)
      run: |
        pytest -v -m "not live_eval"

    - name: Run RAG and Agent Evaluation Benchmark
      run: |
        python -m src.evaluation.runner --group all --compare reports/eval/baseline_v1.json
