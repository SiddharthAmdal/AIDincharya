<script>
    // Simple Interaction logic for form focus states
    const inputs = document.querySelectorAll('input[id="username"], input[type="password"]');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            const label = input.parentElement.parentElement.querySelector('label');
            if (label) label.classList.add('text-primary');
        });
        input.addEventListener('blur', () => {
            const label = input.parentElement.parentElement.querySelector('label');
            if (label) label.classList.remove('text-primary');
        });
    });
</script>
